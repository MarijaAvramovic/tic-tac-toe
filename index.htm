<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
    <title>Tic Tac Toe</title>
</head>
<body>
    
    <div class="grid-container">
        <div class="grid-item names">
            
          <div>
            <h1>Enter names:</h1><label for="o">O:</label><input type="text" id="o" placeholder="O"> <br>
       <label for="x">X</label>
        <input type="text" id="x" placeholder="X">
         <button id="start">Start game</button>
        </div>
       
        </div>
        <div class="grid-item board">
            <div class="container">
                <div   class="item zero" data-index="0">O</div>
                <div class="item one" data-index="1">X</div>
                <div class="item two" data-index="2">O</div>
                <div class="item three" data-index="3">O</div>
                <div class="item four" data-index="4">5</div>
                <div class="item five" data-index="5">6</div>
                <div class="item six" data-index="6">O</div>
                <div class="item seven" data-index="7">8</div>
                <div class="item eight" data-index="8"></div>
        </div>
        </div>
        <div class="grid-item winner">winner

            
        </div>
        <div class="grid-item control">

            <div class="players"></div>
            <div class="btn-div"><button class="reset">Restart</button></div>
            <div class="btn-div"></div>
            <div class="btn-div"></div>
            <div class="btn-div"></div>
        </div>
    </div>
</body>
</html>
